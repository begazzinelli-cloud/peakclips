<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peak Clips — Conectando ao TikTok</title>
<link rel="icon" href="../logo.png">
<style>
  body { margin: 0; background: #101010; color: #EDEDED; font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 20px; text-align: center; }
  h1 { font-size: 1.4rem; } .suave { color: #A8A8A8; } a { color: #95FB09; }
  code { background: #1d1d1d; padding: 4px 8px; border-radius: 6px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <img src="../logo.png" alt="Peak Clips" width="72" height="72">
  <h1 id="titulo">Conectando sua conta do TikTok…</h1>
  <p class="suave" id="msg">Voltando para o painel de publicação do Peak Clips no seu computador.</p>
  <p id="extra"></p>
</main>
<script>
  // O TikTok devolve ?code=...&state=... aqui. Repassamos ao painel local do Peak Clips (127.0.0.1),
  // que troca o código pelo token. Nada é guardado neste site.
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), state = q.get("state"), erro = q.get("error");
  if (erro) {
    document.getElementById("titulo").textContent = "Conexão não autorizada";
    document.getElementById("msg").textContent = q.get("error_description") || erro;
  } else if (code) {
    const destino = "http://127.0.0.1:8765/tiktok/callback?" + new URLSearchParams({code, state: state || ""});
    document.getElementById("extra").innerHTML = 'Se nada acontecer, <a href="' + destino + '">clique aqui</a>.';
    location.replace(destino);
  } else {
    document.getElementById("titulo").textContent = "Peak Clips";
    document.getElementById("msg").textContent = "Página de retorno do login do TikTok.";
  }
</script>
</body>
</html>
